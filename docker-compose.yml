services:
  postgres:
    image: postgres:17
    container_name: vewave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vewave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - vewave_postgres_data:/var/lib/postgresql/data

volumes:
  vewave_postgres_data:
